[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-entity-agent"
version = "0.12.2"
description = "Агент для проверки сведений о юридических лицах по официальным сервисам ФНС"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
bot = ["aiogram>=3.20,<4", "aiohttp>=3.9,<4", "aiohttp-socks>=0.10,<1"]
deep-check = ["atomno-mcp-fns-check>=0.1.12,<0.2"]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "aiogram>=3.20,<4",
    "aiohttp>=3.9,<4",
]
lint = ["ruff>=0.16,<0.17"]

[project.scripts]
legal-entity-check = "legal_entity_agent.cli:main"
legal-entity-bot = "legal_entity_agent.telegram_bot:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]
